glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
json-simple = { group = "com.googlecode.json-simple", name = "json-simple", version.ref = "json-simple" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workRuntime" }
google-places = { module = "com.google.android.libraries.places:places", version.ref = "places" }
volley = { module = "com.android.volley:volley", version.ref = "volley" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version = "2.0.1" }

